<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Cá Nhân - Kiệt Vũ</title>
    
    <!-- Tải Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tải Font Awesome cho các Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tải Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            /* Ảnh nền trang */
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8EP4ai6ji-YOm2XYJAtGI3cb7sOdIXbB6bivY21pIb1mVEk2pMxZ4k_z4&s=10');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
            overflow-x: hidden; /* Ngăn cuộn ngang nếu con mèo lọt ra ngoài */
        }

        /* Lớp phủ làm mờ ảnh nền để nổi bật chữ */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            z-index: -1;
        }

        /* Container chứa bong bóng bay */
        #bubbles-container {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: floatUp infinite ease-in;
            backdrop-filter: blur(2px);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        /* Nút bấm Glassmorphism */
        .glass-btn {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.7);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .main-container {
            position: relative;
            z-index: 10;
        }

        /* Thêm CSS cho con mèo */
        #cat {
            position: fixed; /* Dùng fixed để mèo luôn ở trên màn hình kể cả khi cuộn */
            font-size: 50px; 
            z-index: 9999; /* Đảm bảo mèo luôn nằm trên cùng */
            user-select: none; 
            pointer-events: none; /* Không cản trở việc click vào các nút bên dưới */
            top: 50%;
            left: 50%;
            /* Bỏ translate ở đây vì JS sẽ tự tính toán vị trí tuyệt đối */
        }
    </style>
</head>

<body class="antialiased">
    <!-- Overlay mờ -->
    <div class="bg-overlay"></div>
    
    <!-- Vùng chứa bong bóng bay bổng -->
    <div id="bubbles-container"></div>

    <!-- NỘI DUNG MỚI: Thẻ div của con mèo -->
    <div id="cat">🐈</div>

    <!-- Nội dung chính -->
    <div class="main-container max-w-md mx-auto pt-16 pb-20 px-5 flex flex-col items-center">
        
        <!-- Ảnh Đại Diện -->
        <div class="relative w-28 h-28 mb-4">
            <div class="absolute inset-0 bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 rounded-full animate-spin-slow" style="animation-duration: 4s; padding: 3px;">
                <img 
                    src="https://scontent.fsgn5-3.fna.fbcdn.net/v/t39.30808-6/679365368_1623643732204589_1495274690089814710_n.jpg?stp=dst-jpg_tt6&cstp=mx960x960&ctp=s960x960&_nc_cat=104&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=6ee11a&_nc_ohc=AN72wMzl44wQ7kNvwFl_WHF&_nc_oc=Adpq1oLvkVWNmau9E2NxIzed9Z9gn_EqG7CPYHiPqKQc6uucwcQjN86jSRYaRgERo_kqN1y1B_I6ljMAokOpF7mg&_nc_zt=23&_nc_ht=scontent.fsgn5-3.fna&_nc_gid=88ptrUvSFZc2Q_cJaZGhEQ&_nc_ss=7b2a8&oh=00_AQBbIG49IewnP2Gd5YAfWV2BAgKJi8Mh6lTrD7_fUL9Wcg&oe=6A599C85" 
                    alt="Kiệt Vũ" 
                    class="w-full h-full object-cover rounded-full border-4 border-white/80"
                >
            </div>
        </div>

        <!-- Tên và Bio -->
        <h1 class="text-2xl font-bold text-white mb-2 tracking-wide drop-shadow-md">Kiệt Vũ</h1>
        <p class="text-sm text-gray-200 mb-8 text-center px-4 font-light drop-shadow">
            Chào mừng đến với không gian âm nhạc và màu sắc của tôi ✨
        </p>

        <!-- Danh sách Link -->
        <div class="w-full flex flex-col gap-4 mb-8">
            
            <!-- Facebook -->
            <a href="https://www.facebook.com/messages/t/6606528699419963" target="_blank" class="glass-btn flex items-center justify-between px-6 py-4 rounded-2xl w-full text-gray-800 font-semibold no-underline group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-[#1877F2] flex items-center justify-center text-white text-xl shadow-md group-hover:bg-[#166FE5] transition-colors">
                        <i class="fab fa-facebook-f"></i>
                    </div>
                    <span>Facebook Message</span>
                </div>
                <i class="fas fa-chevron-right text-gray-400 group-hover:text-gray-800 transition-colors"></i>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/" target="_blank" class="glass-btn flex items-center justify-between px-6 py-4 rounded-2xl w-full text-gray-800 font-semibold no-underline group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-[#FFDC80] via-[#F56040] to-[#833AB4] flex items-center justify-center text-white text-xl shadow-md">
                        <i class="fab fa-instagram"></i>
                    </div>
                    <span>Instagram</span>
                </div>
                <i class="fas fa-chevron-right text-gray-400 group-hover:text-gray-800 transition-colors"></i>
            </a>

            <!-- TikTok -->
            <a href="https://www.tiktok.com/@kietvu8480" target="_blank" class="glass-btn flex items-center justify-between px-6 py-4 rounded-2xl w-full text-gray-800 font-semibold no-underline group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-black flex items-center justify-center text-white text-xl shadow-md group-hover:bg-gray-800 transition-colors">
                        <i class="fab fa-tiktok"></i>
                    </div>
                    <span>TikTok</span>
                </div>
                <i class="fas fa-chevron-right text-gray-400 group-hover:text-gray-800 transition-colors"></i>
            </a>

            <!-- Discord -->
            <a href="https://discord.com/channels/@me" target="_blank" class="glass-btn flex items-center justify-between px-6 py-4 rounded-2xl w-full text-gray-800 font-semibold no-underline group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-[#5865F2] flex items-center justify-center text-white text-xl shadow-md group-hover:bg-[#4752C4] transition-colors">
                        <i class="fab fa-discord"></i>
                    </div>
                    <span>Discord</span>
                </div>
                <i class="fas fa-chevron-right text-gray-400 group-hover:text-gray-800 transition-colors"></i>
            </a>
        </div>

        <!-- Trình Phát Video MP4 (Sửa tên thành video.mp4.mp4 theo ảnh) -->
        <div class="w-full bg-white/50 backdrop-blur-xl border border-white/60 rounded-2xl p-4 shadow-[0_8px_30px_rgb(0,0,0,0.12)] flex flex-col gap-3">
            <div class="flex items-center justify-between mb-1">
                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 flex items-center gap-2">
                    <i class="fas fa-film text-lg"></i> Video Của Tôi
                </span>
                <span class="text-xs font-semibold text-gray-700 bg-white/60 px-3 py-1 rounded-full truncate max-w-[140px]">BTT - SPIDEYBOY</span>
            </div>
            
            <div class="w-full aspect-video rounded-xl overflow-hidden shadow-inner bg-black">
                <!-- Tên file chính xác trên GitHub của bạn là video.mp4.mp4 -->
                <video 
                    class="w-full h-full object-cover" 
                    controls 
                    loop 
                    playsinline
                    src="video.mp4.mp4">
                    Trình duyệt của bạn không hỗ trợ thẻ video.
                </video>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- 1. LOGIC BONG BÓNG ---
            const bubblesContainer = document.getElementById('bubbles-container');
            const bubbleCount = 15; // Số lượng bong bóng

            for (let i = 0; i < bubbleCount; i++) {
                createBubble();
            }

            function createBubble() {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                
                // Random kích thước, vị trí và thời gian bay
                const size = Math.random() * 40 + 10; // 10px - 50px
                const left = Math.random() * 100; // 0% - 100%
                const duration = Math.random() * 10 + 5; // 5s - 15s
                const delay = Math.random() * 5; // 0s - 5s

                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${left}%`;
                bubble.style.animationDuration = `${duration}s`;
                bubble.style.animationDelay = `${delay}s`;

                bubblesContainer.appendChild(bubble);
            }

            // --- 2. LOGIC CON MÈO CHẠY ---
            const cat = document.getElementById('cat');

            // Khởi tạo vị trí ngẫu nhiên
            let x = Math.random() * (window.innerWidth - 50);
            let y = Math.random() * (window.innerHeight - 50);

            // Tốc độ và hướng di chuyển
            let speedX = 3;
            let speedY = 3;
            let facingRight = true;

            // Đặt ngẫu nhiên hướng ban đầu
            if (Math.random() > 0.5) { speedX = -speedX; facingRight = false; }
            if (Math.random() > 0.5) { speedY = -speedY; }

            function animateCat() {
                // Cập nhật vị trí
                x += speedX;
                y += speedY;

                // Lấy ranh giới màn hình
                const catRect = cat.getBoundingClientRect();
                const rightEdge = window.innerWidth - catRect.width;
                const bottomEdge = window.innerHeight - catRect.height;

                // Kiểm tra va chạm viền ngang (X)
                if (x <= 0) {
                    x = 0;
                    speedX = -speedX; // Đảo hướng
                    facingRight = true; // Mèo quay sang phải
                } else if (x >= rightEdge) {
                    x = rightEdge;
                    speedX = -speedX; // Đảo hướng
                    facingRight = false; // Mèo quay sang trái
                }

                // Kiểm tra va chạm viền dọc (Y)
                if (y <= 0) {
                    y = 0;
                    speedY = -speedY; // Đảo hướng
                } else if (y >= bottomEdge) {
                    y = bottomEdge;
                    speedY = -speedY; // Đảo hướng
                }

                // Cập nhật CSS hiển thị
                cat.style.left = x + 'px';
                cat.style.top = y + 'px';
                
                // Lật mặt con mèo tùy theo hướng đi
                if (facingRight) {
                    cat.style.transform = 'scaleX(1)';
                } else {
                    cat.style.transform = 'scaleX(-1)'; // Lật ngược theo chiều ngang
                }

                // Yêu cầu frame tiếp theo
                requestAnimationFrame(animateCat);
            }

            // Bắt đầu chạy animation con mèo
            animateCat();

            // Xử lý khi thay đổi kích thước cửa sổ để mèo không rớt ra ngoài
            window.addEventListener('resize', () => {
                 const catRect = cat.getBoundingClientRect();
                 if (x > window.innerWidth - catRect.width) x = window.innerWidth - catRect.width;
                 if (y > window.innerHeight - catRect.height) y = window.innerHeight - catRect.height;
            });
        });
    </script>
</body>
</html>
