<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Cá Nhân - Kiệt Vũ</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load FontAwesome cho icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #111;
        }

        /* Hình nền mờ phía sau */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8EP4ai6ji-YOm2XYJAtGI3cb7sOdIXbB6bivY21pIb1mVEk2pMxZ4k_z4&s=10');
            background-size: cover;
            background-position: center;
            filter: blur(10px);
            transform: scale(1.1);
            z-index: -2;
        }

        /* Lớp phủ gradient để làm nổi bật nội dung */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(0,0,0,0.6) 0%, rgba(30,10,60,0.6) 100%);
            z-index: -1;
        }

        /* Hiệu ứng kính (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border-color: rgba(255,255,255,0.4);
        }

        /* Hiệu ứng phần tử bay bổng */
        .floating-el {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            animation: floatUp 10s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(-20vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative text-white">
    
    <!-- Background Elements -->
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
    <div id="floating-container"></div>

    <!-- Main Bio Card -->
    <div class="glass-card w-full max-w-md rounded-[32px] p-6 relative z-10 flex flex-col items-center animate-fade-in-up">
        
        <!-- Avatar -->
        <div class="relative w-28 h-28 mb-4">
            <div class="absolute inset-0 bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500 rounded-full animate-spin-slow" style="animation-duration: 8s;"></div>
            <img src="https://scontent.fsgn5-3.fna.fbcdn.net/v/t39.30808-6/679365368_1623643732204589_1495274690089814710_n.jpg?stp=dst-jpg_tt6&cstp=mx960x960&ctp=s960x960&_nc_cat=104&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=6ee11a&_nc_ohc=AN72wMzl44wQ7kNvwFl_WHF&_nc_oc=Adpq1oLvkVWNmau9E2NxIzed9Z9gn_EqG7CPYHiPqKQc6uucwcQjN86jSRYaRgERo_kqN1y1B_I6ljMAokOpF7mg&_nc_zt=23&_nc_ht=scontent.fsgn5-3.fna&_nc_gid=88ptrUvSFZc2Q_cJaZGhEQ&_nc_ss=7b2a8&oh=00_AQBbIG49IewnP2Gd5YAfWV2BAgKJi8Mh6lTrD7_fUL9Wcg&oe=6A599C85" 
                 alt="Avatar" 
                 class="absolute inset-1 w-[104px] h-[104px] rounded-full object-cover border-2 border-[#111] z-10">
        </div>

        <!-- Tên & Mô tả -->
        <h1 class="text-2xl font-bold mb-1 tracking-wide">Kiệt Vũ</h1>
        <p class="text-gray-300 text-sm mb-6 text-center px-4">
            Welcome to my colorful world 🌈<br>Âm nhạc, Game và Chill.
        </p>

        <!-- Social Links -->
        <div class="w-full flex flex-col gap-3 mb-6">
            <!-- Facebook -->
            <a href="https://www.facebook.com/messages/t/6606528699419963" target="_blank" class="glass-btn flex items-center justify-between px-5 py-3.5 rounded-2xl w-full text-white no-underline group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-[#1877F2] flex items-center justify-center text-xl shadow-md group-hover:scale-110 transition-transform">
                        <i class="fab fa-facebook-messenger"></i>
                    </div>
                    <span class="font-medium">Facebook Message</span>
                </div>
                <i class="fas fa-chevron-right text-gray-400 group-hover:text-white transition-colors"></i>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/" target="_blank" class="glass-btn flex items-center justify-between px-5 py-3.5 rounded-2xl w-full text-white no-underline group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-[#f09433] via-[#dc2743] to-[#bc1888] flex items-center justify-center text-xl shadow-md group-hover:scale-110 transition-transform">
                        <i class="fab fa-instagram"></i>
                    </div>
                    <span class="font-medium">Instagram</span>
                </div>
                <i class="fas fa-chevron-right text-gray-400 group-hover:text-white transition-colors"></i>
            </a>

            <!-- TikTok -->
            <a href="https://www.tiktok.com/@kietvu8480" target="_blank" class="glass-btn flex items-center justify-between px-5 py-3.5 rounded-2xl w-full text-white no-underline group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-black flex items-center justify-center text-xl shadow-md border border-gray-700 group-hover:scale-110 transition-transform">
                        <i class="fab fa-tiktok"></i>
                    </div>
                    <span class="font-medium">TikTok</span>
                </div>
                <i class="fas fa-chevron-right text-gray-400 group-hover:text-white transition-colors"></i>
            </a>

            <!-- Discord -->
            <a href="https://discord.com/channels/@me" target="_blank" class="glass-btn flex items-center justify-between px-5 py-3.5 rounded-2xl w-full text-white no-underline group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-[#5865F2] flex items-center justify-center text-xl shadow-md group-hover:scale-110 transition-transform">
                        <i class="fab fa-discord"></i>
                    </div>
                    <span class="font-medium">Discord</span>
                </div>
                <i class="fas fa-chevron-right text-gray-400 group-hover:text-white transition-colors"></i>
            </a>
        </div>

        <!-- Trình Phát Video MP4 -->
        <div class="w-full bg-black/40 backdrop-blur-md border border-white/20 rounded-2xl p-4 shadow-lg flex flex-col gap-3">
            <div class="flex items-center justify-between mb-1">
                <span class="text-xs font-bold uppercase tracking-wider text-pink-400 flex items-center gap-2">
                    <i class="fas fa-film text-lg"></i> Video Của Tôi
                </span>
                <span class="text-xs font-semibold text-white/80 bg-white/10 px-3 py-1 rounded-full truncate max-w-[140px]">BTT - SPIDEYBOY</span>
            </div>
            
            <!-- Container responsive cho Video MP4 -->
            <div class="w-full aspect-video rounded-xl overflow-hidden shadow-inner bg-black">
                <!-- Chữ video.mp4 phải khớp 100% với tên file bạn vừa up lên Github -->
                <video 
                    class="w-full h-full object-cover" 
                    controls 
                    playsinline
                    src="video.mp4">
                    Trình duyệt của bạn không hỗ trợ thẻ video.
                </video>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('floating-container');
            const items = ['🎵', '🎶', '🫧', '✨', '🎸']; // Các icon bay bay
            
            // Hàm tạo phần tử bay
            function createFloatingItem() {
                const el = document.createElement('div');
                el.classList.add('floating-el');
                
                // Chọn icon ngẫu nhiên
                el.innerHTML = items[Math.floor(Math.random() * items.length)];
                
                // Vị trí ngang ngẫu nhiên
                el.style.left = Math.random() * 100 + 'vw';
                
                // Kích thước ngẫu nhiên
                const size = Math.random() * 1.5 + 0.8;
                el.style.fontSize = `${size}rem`;
                
                // Thời gian bay ngẫu nhiên (chậm rãi)
                const duration = Math.random() * 10 + 10;
                el.style.animationDuration = `${duration}s`;
                
                container.appendChild(el);
                
                // Xóa phần tử khi bay xong để nhẹ bộ nhớ
                setTimeout(() => {
                    el.remove();
                }, duration * 1000);
            }

            // Tạo item mới mỗi 1.5 giây
            setInterval(createFloatingItem, 1500);

            // Tạo sẵn vài item lúc mới load trang
            for(let i=0; i<5; i++) {
                setTimeout(createFloatingItem, i * 300);
            }
        });
    </script>
</body>
</html>
