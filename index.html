<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Cá Nhân - Kiệt Vũ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8EP4ai6ji-YOm2XYJAtGI3cb7sOdIXbB6bivY21pIb1mVEk2pMxZ4k_z4&s=10');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
            overflow-x: hidden;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            z-index: -1;
        }

        /* Waves Animation */
        .wave-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }
        .wave {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 100px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="0.1" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,112C672,96,768,96,864,112C960,128,1056,160,1152,160C1248,160,1344,128,1392,112L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>');
            background-repeat: repeat-x;
            animation: waveMove 15s linear infinite;
        }
        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Bubbles */
        #bubbles-container {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            pointer-events: none;
        }
        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: floatUp infinite ease-in;
            backdrop-filter: blur(2px);
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        /* Glassmorphism */
        .glass-btn {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-5px) scale(1.02);
        }

        #cat {
            position: fixed;
            font-size: 40px;
            z-index: 9999;
            pointer-events: none;
            transition: transform 0.2s;
        }

        .fade-in { animation: fadeIn 1s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body class="antialiased">
    <div class="bg-overlay"></div>
    <div id="bubbles-container"></div>
    <div id="cat">🐈</div>

    <!-- Waves Background -->
    <div class="wave-container">
        <div class="wave"></div>
    </div>

    <div class="main-container max-w-md mx-auto pt-16 pb-20 px-5 flex flex-col items-center fade-in">
        
        <!-- Profile Picture -->
        <div class="relative w-28 h-28 mb-4">
            <div class="absolute inset-0 bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 rounded-full animate-spin-slow" style="animation-duration: 4s; padding: 3px;">
                <img src="https://scontent.fsgn5-3.fna.fbcdn.net/v/t39.30808-6/679365368_1623643732204589_1495274690089814710_n.jpg?stp=dst-jpg_tt6&cstp=mx960x960&ctp=s960x960&_nc_cat=104&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=6ee11a&_nc_ohc=AN72wMzl44wQ7kNvwFl_WHF&_nc_oc=Adpq1oLvkVWNmau9E2NxIzed9Z9gn_EqG7CPYHiPqKQc6uucwcQjN86jSRYaRgERo_kqN1y1B_I6ljMAokOpF7mg&_nc_zt=23&_nc_ht=scontent.fsgn5-3.fna&_nc_gid=88ptrUvSFZc2Q_cJaZGhEQ&_nc_ss=7b2a8&oh=00_AQBbIG49IewnP2Gd5YAfWV2BAgKJi8Mh6lTrD7_fUL9Wcg&oe=6A599C85" alt="Kiệt Vũ" class="w-full h-full object-cover rounded-full border-4 border-white/80">
            </div>
        </div>

        <h1 class="text-2xl font-bold text-white mb-2 tracking-wide drop-shadow-md">Kiệt Vũ</h1>
        <p class="text-sm text-gray-200 mb-8 text-center px-4 font-light drop-shadow">
            Chào mừng đến với không gian âm nhạc và màu sắc của tôi ✨
        </p>

        <!-- Links Section -->
        <div class="w-full flex flex-col gap-4 mb-8">
            <!-- Locket Link (New) -->
            <a href="https://locket.camera/links/yakivqAda4gHFZnA6" target="_blank" class="glass-btn flex items-center justify-between px-6 py-4 rounded-2xl w-full text-white font-semibold no-underline group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-pink-500 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-110 transition-transform">
                        <i class="fas fa-heart"></i>
                    </div>
                    <span>Locket</span>
                </div>
                <i class="fas fa-chevron-right text-gray-200"></i>
            </a>

            <!-- Facebook -->
            <a href="https://www.facebook.com/messages/t/6606528699419963" target="_blank" class="glass-btn flex items-center justify-between px-6 py-4 rounded-2xl w-full text-white font-semibold no-underline group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-[#1877F2] flex items-center justify-center text-white text-xl shadow-md group-hover:scale-110 transition-transform">
                        <i class="fab fa-facebook-f"></i>
                    </div>
                    <span>Facebook Message</span>
                </div>
                <i class="fas fa-chevron-right text-gray-200"></i>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/" target="_blank" class="glass-btn flex items-center justify-between px-6 py-4 rounded-2xl w-full text-white font-semibold no-underline group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-[#FFDC80] via-[#F56040] to-[#833AB4] flex items-center justify-center text-white text-xl shadow-md group-hover:scale-110 transition-transform">
                        <i class="fab fa-instagram"></i>
                    </div>
                    <span>Instagram</span>
                </div>
                <i class="fas fa-chevron-right text-gray-200"></i>
            </a>

            <!-- TikTok -->
            <a href="https://www.tiktok.com/@kietvu8480" target="_blank" class="glass-btn flex items-center justify-between px-6 py-4 rounded-2xl w-full text-white font-semibold no-underline group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-black flex items-center justify-center text-white text-xl shadow-md group-hover:scale-110 transition-transform">
                        <i class="fab fa-tiktok"></i>
                    </div>
                    <span>TikTok</span>
                </div>
                <i class="fas fa-chevron-right text-gray-200"></i>
            </a>
        </div>

        <!-- Video Player -->
        <div class="w-full bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl p-4 shadow-xl flex flex-col gap-3">
            <div class="flex items-center justify-between mb-1">
                <span class="text-xs font-bold uppercase tracking-wider text-indigo-200 flex items-center gap-2">
                    <i class="fas fa-film"></i> Video Của Tôi
                </span>
            </div>
            <div class="w-full aspect-video rounded-xl overflow-hidden bg-black">
                <video class="w-full h-full object-cover" controls loop playsinline src="video.mp4.mp4">
                    Trình duyệt của bạn không hỗ trợ thẻ video.
                </video>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Bubbles
            const bubblesContainer = document.getElementById('bubbles-container');
            for (let i = 0; i < 15; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                const size = Math.random() * 40 + 10;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}%`;
                bubble.style.animationDuration = `${Math.random() * 10 + 5}s`;
                bubble.style.animationDelay = `${Math.random() * 5}s`;
                bubblesContainer.appendChild(bubble);
            }

            // Cat Logic
            const cat = document.getElementById('cat');
            let x = Math.random() * (window.innerWidth - 50);
            let y = Math.random() * (window.innerHeight - 50);
            let speedX = 2;
            let speedY = 2;
            let facingRight = true;

            function animateCat() {
                x += speedX;
                y += speedY;

                if (x <= 0 || x >= window.innerWidth - 50) {
                    speedX = -speedX;
                    facingRight = !facingRight;
                }
                if (y <= 0 || y >= window.innerHeight - 50) {
                    speedY = -speedY;
                }

                cat.style.left = x + 'px';
                cat.style.top = y + 'px';
                cat.style.transform = facingRight ? 'scaleX(1)' : 'scaleX(-1)';
                requestAnimationFrame(animateCat);
            }
            animateCat();
        });
    </script>
</body>
</html>
